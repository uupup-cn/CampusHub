server:
  port: 8080
  mode: debug
  read_timeout: 30
  write_timeout: 30

database:
  host: 127.0.0.1
  port: 5432
  user: campushub
  password: campushub_dev
  dbname: campushub
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 300

jwt:
  secret: change-me-in-production
  access_expire: 7200
  refresh_expire: 2592000

rate_limit:
  enabled: true
  requests_per_second: 100
  burst: 200

cors:
  allowed_origins:
    - http://localhost:3000
    - http://localhost:4200
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed_headers:
    - Content-Type
    - Authorization
    - X-API-Key
    - X-Admin-Key
